
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Love ❤️</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}
body {
  background: #090009;
  color: white;
  font-family: Arial, sans-serif;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  text-align: center;
  overflow: hidden;
}
.container {
  padding: 25px;
}
.heart {
  font-size: 90px;
  animation: beat 1s infinite;
}
h1 {
  color: #ff4d88;
  margin: 20px;
}
p {
  line-height: 1.7;
  color: #ffd6e5;
}
button {
  margin-top: 25px;
  padding: 13px 25px;
  border: none;
  border-radius: 25px;
  background: #ff4081;
  color: white;
  font-size: 17px;
}
#pesan {
  display: none;
  margin-top: 20px;
  color: #ff8ab5;
}
@keyframes beat {
  50% { transform: scale(1.2); }
}
</style>
</head>
<body>
<div class="container">
  <div class="heart">❤️</div>
  <h1>Hai, Kamu!</h1>
  <p>
    Ada sesuatu yang ingin aku sampaikan.<br>
    Terima kasih sudah menjadi seseorang<br>
    yang begitu istimewa.
  </p>
  <button onclick="kejutan()">Klik Kejutan ❤️</button>
  <div id="pesan">
    <h2>Kamu Istimewa! 💖</h2>
    <p>Semoga hari-harimu selalu dipenuhi kebahagiaan.</p>
  </div>
</div>
<script>
function kejutan() {
  document.getElementById("pesan").style.display = "block";
}
</script>
</body>
</html>
